<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#b45309" />
    <title>Offline · RentCorp</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, sans-serif;
        background: #fafaf9;
        color: #1c1917;
        padding: 16px;
        text-align: center;
      }
      main { max-width: 22rem; }
      img { width: 64px; height: 64px; border-radius: 16px; }
      h1 { font-size: 1.25rem; margin: 16px 0 8px; }
      p { color: #57534e; margin: 0 0 20px; }
      a {
        display: inline-block;
        background: #b45309;
        color: #fff;
        padding: 12px 20px;
        border-radius: 10px;
        text-decoration: none;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You’re offline</h1>
      <p>RentCorp needs an internet connection. Check your mobile data or Wi-Fi and try again.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
