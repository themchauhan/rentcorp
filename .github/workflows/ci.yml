name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test

      # Local Supabase (Docker) with migrations + seed applied.
      - name: Start Supabase
        run: npm run db:start
      - name: RLS / database tests
        run: npm run db:test
      - name: Backup + restore check
        run: npm run db:backup-test
      - name: Write .env.local from local Supabase
        run: |
          # Keys of the throwaway Supabase instance started above (not production).
          eval "$(npx supabase status -o env | grep -E '^(API_URL|PUBLISHABLE_KEY|SECRET_KEY)=')"
          echo "::add-mask::$SECRET_KEY"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
            echo "NEXT_PUBLIC_APP_URL=http://localhost:3100"
            echo "SUPABASE_SECRET_KEY=$SECRET_KEY"
          } > .env.local
          # Lets the bundle scan look for the literal secret value.
          echo "SUPABASE_SECRET_KEY=$SECRET_KEY" >> "$GITHUB_ENV"

      - run: npm run build
      - name: No secrets in client bundle
        run: node scripts/check-client-bundle.mjs

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: E2E tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
